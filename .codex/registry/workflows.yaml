schema_version: 1
workflows:
  - id: bug-fixing
    display_name: "缺陷修复"
    supported_stacks:
      - springboot
      - vue
    skill_by_stack:
      springboot: springboot-bug-fixing
      vue: vue-bug-fixing
    initial_artifacts:
      - request-brief
    stages:
      - id: intake
        owner: orchestrator
        required: true
        on_failure: block
        consumes:
          - request-brief
        produces:
          - run-context
      - id: standards-inspect
        owner: support
        skill: development-standards
        phase: inspect
        required: true
        on_failure: block
        consumes:
          - run-context
        produces:
          - standards-context
          - standards-fingerprint
      - id: evidence
        owner: leaf
        phase: evidence
        required: true
        on_failure: block
        consumes:
          - run-context
          - standards-context
        produces:
          - repository-context
          - evidence
      - id: reproduce
        owner: leaf
        phase: reproduce
        required: true
        on_failure: continue-with-warning
        consumes:
          - evidence
        produces:
          - reproduction
      - id: diagnose
        owner: leaf
        phase: diagnose
        required: true
        on_failure: block
        consumes:
          - evidence
          - reproduction
        produces:
          - diagnosis
      - id: fix
        owner: leaf
        phase: fix
        required: true
        on_failure: block
        consumes:
          - diagnosis
        produces:
          - change-summary
      - id: standards-check
        owner: support
        skill: development-standards
        phase: check
        required: true
        on_failure: block
        consumes:
          - run-context
          - standards-context
          - change-summary
          - standards-fingerprint
        produces:
          - standards-report
      - id: api-doc-inspect
        owner: support
        skill: api-documentation
        phase: inspect
        required: true
        on_failure: block
        consumes:
          - change-summary
          - standards-report
        produces:
          - api-documentation-plan
      - id: api-doc-update
        owner: support
        skill: api-documentation
        phase: update
        required: true
        on_failure: block
        consumes:
          - api-documentation-plan
        produces:
          - api-documentation-change
      - id: api-doc-verify
        owner: support
        skill: api-documentation
        phase: verify
        required: true
        on_failure: block
        consumes:
          - api-documentation-change
        produces:
          - api-documentation-report
      - id: regression-test
        owner: leaf
        phase: regression-test
        required: true
        on_failure: block
        consumes:
          - change-summary
          - api-documentation-report
          - standards-report
        produces:
          - test-report
      - id: verify
        owner: leaf
        phase: verify
        required: true
        on_failure: block
        consumes:
          - change-summary
          - test-report
          - standards-report
        produces:
          - validation-report
      - id: handoff
        owner: orchestrator
        required: true
        on_failure: block
        consumes:
          - validation-report
        produces:
          - handoff
