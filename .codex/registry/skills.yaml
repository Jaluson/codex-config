schema_version: 1
skills:
  - id: springboot-bug-fixing
    path: .codex/skills/springboot-bug-fixing
    stack: springboot
    work_type: bug-fixing
    role: leaf
    status: active
    direct_invocation: true
    phases:
      - id: evidence
        section: "1. 收集仓库和问题证据"
      - id: reproduce
        section: "2. 建立最小复现"
      - id: diagnose
        section: "3. 定位根因并设计修复"
      - id: fix
        section: "4. 实施并保护兼容性"
      - id: regression-test
        section: "4. 实施并保护兼容性"
      - id: verify
        section: "5. 分层验证和交付"
